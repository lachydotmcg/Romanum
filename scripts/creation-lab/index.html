<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Romanum · Creation lab</title>
<style nonce="__NONCE__">
:root{color-scheme:dark;font:15px/1.5 system-ui,sans-serif;background:#000;color:#fff}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:32px 24px}header,.row,.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between;margin-bottom:32px}.brand{font-size:22px;font-weight:650;letter-spacing:-.6px}h1{font-size:30px;letter-spacing:-1px;margin:0}h2{font-size:17px;margin:0 0 20px}p{color:#aaa;margin:8px 0 0}.pill{border:1px solid #262626;border-radius:8px;padding:5px 10px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1.15fr;gap:20px;margin:28px 0}.panel{background:#1b1b1b;border:1px solid #262626;border-radius:12px;padding:24px}label{display:block;font-size:13px;margin:18px 0 6px}input,textarea,button{font:inherit}input,textarea{width:100%;padding:11px 12px;background:#1b1b1b;border:1px solid #262626;border-radius:8px;color:#fff}textarea{resize:vertical;min-height:94px}button{background:#fff;color:#000;border:1px solid #fff;border-radius:8px;padding:9px 14px;cursor:pointer}button.secondary{background:#1b1b1b;border-color:#262626;color:#fff}button.secondary:hover{background:#262626}button:disabled{opacity:.4;cursor:default}:focus-visible{outline:2px solid #fff;outline-offset:3px}.actions{margin-top:16px;gap:8px}.actions button{font-size:12px;padding:7px 10px}.metrics{display:flex;gap:32px;margin-bottom:22px}.metric strong{display:block;font-size:32px;font-weight:550}.muted,.metric span{color:#aaa;font-size:12px}.job{border-top:1px solid #262626;padding:18px 0}.job:first-child{border-top:0}.job .row{justify-content:space-between}.job-title{font-weight:600;overflow-wrap:anywhere}.empty{color:#aaa;padding:30px 0;text-align:center}#message{min-height:24px;margin-top:16px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #262626}th{color:#aaa;font-weight:400}.scroll{overflow:auto}.submit{margin-top:20px;width:100%}#jobs{max-height:600px;overflow:auto;margin-top:24px}footer{color:#aaa;font-size:12px;margin-top:20px}@media(max-width:760px){main{padding:24px 16px}.grid{grid-template-columns:1fr}.panel{padding:20px}h1{font-size:26px}.metrics{gap:24px}}
</style></head>
<body><main>
<header><div class="brand">Romanum</div><span class="pill">Local · Dry-run</span></header>
<h1>Thumbnail lab</h1><p>Test the workflow. No images generated or API charges.</p>
<div class="grid"><section class="panel"><h2>New concept</h2>
<form id="brief"><label for="game">Game</label><input id="game" name="game" required maxlength="100" autocomplete="off">
<label for="gameplay">What do players do?</label><textarea id="gameplay" name="gameplay" required maxlength="2000"></textarea>
<label for="prompt">Thumbnail idea</label><textarea id="prompt" name="prompt" required maxlength="1000"></textarea>
<button class="submit" type="submit">Queue test concept · 1 credit</button></form>
<div id="message" role="status" aria-live="polite"></div></section>
<section class="panel"><h2>Test credits</h2><div class="metrics"><div class="metric"><strong id="available">—</strong><span>Available</span></div><div class="metric"><strong id="reserved">—</strong><span>Reserved</span></div><div class="metric"><strong id="balance">—</strong><span>Balance</span></div></div>
<button class="secondary" id="topup">Add 20 test credits</button><div id="jobs"></div></section></div>
<section class="panel"><h2>Credit activity</h2><div class="scroll"><table><thead><tr><th>Time</th><th>Action</th><th>Credits</th><th>Balance</th><th>Reserved</th></tr></thead><tbody id="ledger"></tbody></table></div></section>
<footer>Test credits have no monetary value. Saved locally, separate from your Romanum data.</footer>
</main><script nonce="__NONCE__">
const token = '__TOKEN__';
let busy = false;
const $ = id => document.getElementById(id);
const el = (tag,text,className) => { const n=document.createElement(tag); if(text!==undefined)n.textContent=text; if(className)n.className=className; return n; };
const time = value => new Date(value).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
function render(state){
  for(const key of ['available','reserved','balance']) $(key).textContent=state.balance[key];
  $('jobs').replaceChildren();
  if(!state.jobs.length) $('jobs').append(el('div','Your test jobs will appear here.','empty'));
  for(const job of state.jobs){
    const card=el('div',undefined,'job'),row=el('div',undefined,'row');
    row.append(el('span',job.game,'job-title'),el('span',job.status==='succeeded'?'Test completed':job.status,'pill'));
    card.append(row,el('div',`${job.stage==='concept'?'Concept':'Final'} · ${job.quoted_credits} test credit${job.quoted_credits===1?'':'s'} · ${time(job.created_at)}`,'muted'));
    const actions=el('div',undefined,'actions');
    const add=(label,action,data={})=>{const b=el('button',label,'secondary');b.onclick=()=>run({action,jobId:job.id,...data});actions.append(b);};
    if(job.status==='queued'){add('Simulate success','complete');add('Simulate failure','fail');add('Cancel','cancel');}
    if(job.status==='succeeded'&&job.stage==='concept'&&!job.has_final) add('Accept test concept → final · 2 credits','final',{conceptJobId:job.id,jobId:crypto.randomUUID()});
    if(job.status==='succeeded') card.append(el('p','Dry-run complete. No image generated.','muted'));
    if(actions.childElementCount)card.append(actions);
    $('jobs').append(card);
  }
  $('ledger').replaceChildren();
  const labels={grant:'Added',reserve:'Reserved',capture:'Spent',release:'Returned'};
  for(const entry of state.ledger){const row=el('tr');for(const value of [time(entry.created_at),labels[entry.entry_type]||entry.entry_type,entry.amount,entry.balance_after,entry.reserved_after])row.append(el('td',value));$('ledger').append(row);}
}
async function request(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'x-lab-token':token,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});const data=await r.json();if(!r.ok)throw new Error(data.error);return data;}
async function run(body){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);$('message').textContent='';try{render(await request('/action',body));$('message').textContent='Saved.';}catch(e){$('message').textContent=e.message||'Connection lost. Refresh to check the job.';try{render(await request('/state'));}catch{}}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
$('brief').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);run({action:'queue',jobId:crypto.randomUUID(),game:f.get('game'),gameplay:f.get('gameplay'),prompt:f.get('prompt')});};
$('topup').onclick=()=>run({action:'topup',operationId:crypto.randomUUID()});
request('/state').then(render).catch(()=>{$('message').textContent='Could not connect. Refresh to retry.';});
</script></body></html>
